<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawillion</title>
<meta name="description" content="Daily anime trivia. Seven prompts, one answer each. The rarer your answer, the higher you climb.">
<link rel="icon" href="art/hero.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f0ff;--mute:#b9b0d6;--pink:#ff5c9d;--gold:#ffd23f;--cyan:#2ce8f5;--bad:#ff4d5e;--panel:rgba(18,13,36,.86);--edge:#0b0818}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0818;color:var(--ink);font-family:"VT323",monospace;font-size:22px;-webkit-font-smoothing:none}
#stage,#overlay{position:fixed;inset:0;width:100%;height:100%;display:block}
#stage{image-rendering:pixelated;image-rendering:crisp-edges}
#overlay{pointer-events:none;z-index:1}
.fx{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 50%,rgba(5,3,14,.55))}
.fx::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
#flash{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.4}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{10%,50%,90%{transform:translate(-4px,2px)}30%,70%{transform:translate(4px,-2px)}}
.ui{position:fixed;z-index:2}
.hidden{display:none!important}
.px{font-family:"Press Start 2P",monospace}
.panel{background:var(--panel);border:2px solid rgba(255,255,255,.16);box-shadow:0 0 0 3px var(--edge),0 12px 40px rgba(0,0,0,.45)}
.mute{color:var(--mute)}
small{font-size:17px;color:var(--mute)}
.btn{font-family:"Press Start 2P",monospace;font-size:10px;letter-spacing:1px;color:var(--ink);background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.28);padding:11px 13px;cursor:pointer;box-shadow:0 0 0 2px var(--edge)}
.btn:hover{background:rgba(255,255,255,.14);border-color:#fff}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--pink);border-color:#ffc2da;color:#fff;box-shadow:0 0 0 2px var(--edge),0 4px 0 2px #8a1d4a}
.btn.go:hover{filter:brightness(1.1)}
.btn.big{font-size:14px;padding:18px;width:100%;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* title */
#title{left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(9vh,64px) 16px max(20px,env(safe-area-inset-bottom));pointer-events:none}
#title>*{pointer-events:auto}
.logo{font-family:"Press Start 2P",monospace;font-size:clamp(26px,7.4vw,68px);margin:0;letter-spacing:2px;display:flex;justify-content:center;filter:drop-shadow(3px 3px 0 #8a1d4a) drop-shadow(3px 3px 0 #0b0818)}
.logo span{display:inline-block;background:linear-gradient(#ffe36e,#ff8fb8 55%,#ff5c9d);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hop 3s ease-in-out infinite}
@keyframes hop{0%,20%,100%{transform:translateY(0)}10%{transform:translateY(-8px)}}
.subtitle{font-family:"Press Start 2P",monospace;font-size:clamp(9px,1.6vw,13px);color:var(--cyan);letter-spacing:6px;text-align:center;margin-top:14px;text-shadow:2px 0 var(--edge),-2px 0 var(--edge),0 2px var(--edge),0 -2px var(--edge),2px 2px var(--edge)}
.tag{display:table;margin:12px auto 0;text-align:center;font-size:clamp(18px,2.4vw,24px);padding:2px 10px;background:rgba(11,8,24,.6)}
.start{width:min(520px,100%);padding:16px;display:flex;flex-direction:column;gap:10px}
.start .meta{display:flex;justify-content:space-between;font-size:18px;color:var(--mute)}
.start .meta b{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--pink);letter-spacing:2px}
#status{text-align:center;font-size:19px;min-height:22px}

/* hud */
#hud{top:10px;left:10px;right:56px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gauge{padding:6px 10px;min-width:96px}
.gauge b{display:block;font-family:"Press Start 2P",monospace;font-size:7px;color:var(--mute);letter-spacing:2px}
.gauge span{font-size:clamp(22px,3.4vw,30px);line-height:1;color:var(--cyan)}
#scoreG span{color:var(--gold)}
.pipwrap{text-align:center;padding-top:6px}
#pips{display:flex;gap:4px;justify-content:center}
#pips i{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4)}
#pips i.now{border-color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-color:rgba(255,255,255,.2)}}
#pipLabel{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--mute);margin-top:5px;letter-spacing:1px}
#icons{top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.icon{width:38px;height:34px;padding:0;font-size:15px;font-family:inherit;display:grid;place-items:center}
body.on-title #homeBtn,body.on-title #statsIcon{display:none}

/* prompt */
#card{left:50%;top:max(92px,15vh);transform:translateX(-50%);width:min(640px,calc(100% - 24px));padding:16px 20px;text-align:center}
.kicker{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--pink);letter-spacing:2px}
#cardQ{font-family:"Press Start 2P",monospace;font-size:clamp(14px,2.3vw,21px);line-height:1.6;margin:12px 0 8px}
#dock{left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(640px,calc(100% - 24px));display:flex;gap:10px;align-items:center;padding:10px}
#err{position:absolute;left:0;right:0;bottom:calc(100% + 10px);text-align:center;color:var(--bad);font-size:21px;text-shadow:0 2px 0 #000,0 0 8px #000}
#ring{width:56px;height:56px;flex:none;position:relative}
#ring svg{transform:rotate(-90deg);display:block}
#ringNum{position:absolute;inset:0;display:grid;place-items:center;font-family:"Press Start 2P",monospace;font-size:13px}
#ring.danger #ringNum{color:var(--bad);animation:blink .5s steps(2) infinite}
#ring.danger #ringArc{stroke:var(--bad)}
#guess{flex:1;min-width:0;font:inherit;font-size:26px;background:rgba(0,0,0,.45);color:var(--ink);border:2px solid rgba(255,255,255,.2);padding:8px 12px;outline:none;border-radius:0}
#guess:focus{border-color:var(--cyan)}
.jolt{animation:jolt .3s}
@keyframes jolt{25%{margin-left:-8px}75%{margin-left:8px}}

/* reveal */
#reveal{left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(600px,calc(100% - 24px));padding:16px 18px;max-height:64vh;overflow:auto;text-align:center}
#rvTier{font-family:"Press Start 2P",monospace;font-size:clamp(24px,5.6vw,42px);letter-spacing:3px;margin:4px 0 10px}
#rvTier.pop{animation:pop .55s cubic-bezier(.2,1.7,.4,1)}
#rvTier.legend{animation:pop .55s cubic-bezier(.2,1.7,.4,1),shimmer 1.2s linear .55s infinite}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{50%{filter:brightness(1.5)}}
#rvAnswer{font-size:30px;line-height:1.1}
#rvPts{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold);margin:10px 0 4px;letter-spacing:1px}
#rvLine{font-size:20px;color:var(--mute)}
.meter{position:relative;display:flex;gap:3px;margin:16px 4px 4px;height:12px}
.meter div{flex:1;opacity:.28}
.meter div.on{opacity:1;box-shadow:0 0 10px currentColor}
#rvMark{position:absolute;top:-9px;width:0;height:0;border:6px solid transparent;border-top:8px solid #fff;transform:translateX(-6px);transition:left .6s cubic-bezier(.2,1.4,.4,1)}
.mlabels{display:flex;font-family:"Press Start 2P",monospace;font-size:6px;color:var(--mute);margin:0 4px}
.mlabels span{flex:1;text-align:center}
#rvStat{font-size:20px;margin-top:10px;line-height:1.15}
.board{margin:12px 0 4px;text-align:left}
.bhead{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--mute);letter-spacing:2px;margin-bottom:6px}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 50px;gap:8px;align-items:center;font-size:19px;padding:1px 4px}
.brow.me{background:rgba(255,255,255,.1);outline:1px solid rgba(255,255,255,.3)}
.bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb{height:9px;background:rgba(255,255,255,.08)}
.bb i{display:block;height:100%}
.bp{text-align:right;color:var(--mute)}
#rvGem{font-size:19px;color:var(--gold);margin-top:8px;letter-spacing:1px}
#rvNext{margin-top:12px}

/* banner */
#banner{left:0;right:0;top:24vh;text-align:center;pointer-events:none}
#banner.show{animation:banner 2.8s ease forwards}
@keyframes banner{0%{opacity:0;transform:translateY(10px)}12%,78%{opacity:1;transform:none}100%{opacity:0}}
#bannerT{font-family:"Press Start 2P",monospace;font-size:clamp(16px,3.4vw,28px);color:#fff;text-shadow:3px 3px 0 var(--edge),0 0 20px rgba(255,92,157,.7);letter-spacing:3px}
#bannerS{font-size:22px;color:var(--cyan);text-shadow:0 2px 0 var(--edge);margin-top:8px}

/* summary */
#summary{left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 24px));max-height:84vh;overflow:auto;padding:18px;text-align:center}
#smAlt{font-family:"Press Start 2P",monospace;font-size:clamp(26px,6vw,40px);color:var(--gold);margin:12px 0 6px;text-shadow:3px 3px 0 var(--edge)}
#smGrid{font-size:30px;letter-spacing:3px;margin:8px 0}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;font-size:19px;padding:4px 0;border-top:1px solid rgba(255,255,255,.08)}
.srow .st{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sa{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-family:"Press Start 2P",monospace;font-size:7px;padding:4px 5px;color:#0b0818;white-space:nowrap}

/* modal */
#modal{inset:0;background:rgba(5,3,14,.6);display:grid;place-items:center;padding:16px;z-index:3}
#modal .panel{width:min(520px,100%);max-height:86vh;overflow:auto;padding:18px}
#modal h3{font-family:"Press Start 2P",monospace;font-size:13px;color:var(--pink);margin:0 0 12px;letter-spacing:2px}
#modal p{margin:6px 0;line-height:1.15}
.trow{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid rgba(255,255,255,.08)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:12px}
.stats b{display:block;font-family:"Press Start 2P",monospace;font-size:16px;color:var(--gold);margin-bottom:4px}
.stats span{font-size:16px;color:var(--mute)}
@media (max-width:520px){.gauge{min-width:78px;padding:5px 7px}#pips i{width:10px;height:10px}.brow{grid-template-columns:minmax(0,1.4fr) .8fr 44px}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="overlay"></canvas>
<div class="fx"></div>
<div id="flash"></div>

<section id="title" class="ui">
  <div>
    <h1 class="logo" id="logo"></h1>
    <div class="subtitle">THE DAILY ANIME CLIMB</div>
    <div class="tag">Seven prompts. One answer each. The rarer your pick, the higher you climb.</div>
  </div>
  <div class="start panel">
    <div class="meta"><b id="dayLabel">DAY #1</b><span id="streak"></span></div>
    <button class="btn go big" id="begin">▲ BEGIN CLIMB ▲</button>
    <div class="row"><button class="btn" id="endless">ENDLESS</button><button class="btn" id="howBtn">HOW TO PLAY</button><button class="btn" id="statsBtn">STATS</button></div>
    <div id="status"></div>
  </div>
</section>

<div id="hud" class="ui hidden">
  <div class="gauge panel"><b>ALTITUDE</b><span id="altV">0 m</span></div>
  <div class="pipwrap"><div id="pips"></div><div id="pipLabel"></div></div>
  <div class="gauge panel" id="scoreG"><b>SCORE</b><span id="scoreV">0</span></div>
</div>
<div id="icons" class="ui">
  <button class="btn icon" id="soundBtn" title="Sound">♪</button>
  <button class="btn icon" id="homeBtn" title="Home">⌂</button>
  <button class="btn icon" id="statsIcon" title="Stats">▤</button>
  <button class="btn icon" id="helpIcon" title="How to play">?</button>
</div>

<section id="card" class="ui panel hidden">
  <div class="kicker" id="cardK"></div>
  <div id="cardQ"></div>
  <div class="mute" id="cardHint"></div>
</section>

<div id="dock" class="ui panel hidden">
  <div id="err"></div>
  <div id="ring"><svg width="56" height="56"><circle cx="28" cy="28" r="23" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/><circle id="ringArc" cx="28" cy="28" r="23" fill="none" stroke="#2ce8f5" stroke-width="5" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg><span id="ringNum">25</span></div>
  <input id="guess" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type one answer…" maxlength="60">
  <button class="btn go" id="climbBtn">CLIMB</button>
</div>

<section id="reveal" class="ui panel hidden">
  <div id="rvTier"></div>
  <div id="rvAnswer"></div>
  <div id="rvPts"></div>
  <div id="rvLine"></div>
  <div id="rvMeter">
    <div class="meter" id="meter"></div>
    <div class="mlabels"><span>COMMON</span><span>UNCOMMON</span><span>RARE</span><span>EPIC</span><span>LEGEND</span></div>
  </div>
  <div id="rvStat"></div>
  <div class="board" id="rvBoard"></div>
  <div id="rvGem"></div>
  <button class="btn go big hidden" id="rvNext"></button>
</section>

<div id="banner" class="ui hidden"><div id="bannerT"></div><div id="bannerS"></div></div>

<section id="summary" class="ui panel hidden">
  <div class="kicker" id="smHead"></div>
  <div id="smAlt"></div>
  <div id="smWhere" class="mute"></div>
  <div id="smGrid"></div>
  <div id="smRows"></div>
  <div class="row" style="margin-top:14px"><button class="btn go" id="smShare">COPY RESULT</button><button class="btn" id="smEndless">ENDLESS</button><button class="btn" id="smHome">HOME</button></div>
  <div id="smNext" class="mute" style="margin-top:10px"></div>
</section>

<div id="modal" class="ui hidden"><div class="panel" id="modalBody"></div></div>

<script src="questions.js"></script>
<script>
const Q = window.QUESTIONS, $ = id => document.getElementById(id);
const ROUNDS = 7, SECONDS = 25, MAXPTS = ROUNDS * 100, MAXALT = MAXPTS * 10;
const TIERS = [
  { name: "COMMON", pts: 10, col: "#c0cbdc", emoji: "⬜", lines: ["Everyone's first thought.", "Main character energy. Everyone had it.", "The answer the whole class shouted."] },
  { name: "UNCOMMON", pts: 30, col: "#63e07a", emoji: "🟩", lines: ["A solid pick.", "Side-character knowledge. Respect.", "You've watched more than the openings."] },
  { name: "RARE", pts: 60, col: "#3cb8ff", emoji: "🟦", lines: ["Not many climbers said that.", "Filler-arc enjoyer detected.", "Deep in the wiki, aren't you?"] },
  { name: "EPIC", pts: 85, col: "#c46bff", emoji: "🟪", lines: ["A true fan answer.", "You read the manga, didn't you?", "Hardly anyone climbs that way."] },
  { name: "LEGENDARY", pts: 100, col: "#ffd23f", emoji: "🟨", lines: ["The hidden gem of this prompt!", "Your power level just spiked.", "Sensei would be proud."] },
];
const REGIONS = [
  ["STARTER VILLAGE", "Where every journey begins."], ["NINJA FOREST", "Something rustles in the leaves."],
  ["PIRATE SEA", "Salt air and treasure maps."], ["TITAN WALL", "Don't look up. Okay, look up."],
  ["DEMON MOUNTAIN", "The moon is watching."], ["MECHA CITY", "The neon hums all night."], ["SKY CASTLE", "The summit above the clouds."]];
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmtM = alt => (Math.round(alt / 10) * 10).toLocaleString() + " m";
const show = (id, on) => $(id).classList.toggle("hidden", !on);
const pickLine = a => a[Math.floor(Math.random() * a.length)];

/* ---------- days ---------- */
const now = new Date(), localKey = d => d.toLocaleDateString("en-CA");
const dayKey = localKey(now), yesterKey = localKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
const dayNum = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(2026, 10, 1)) / 864e5) + 1;
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 2 ** 32; }; }
function shuffled(rand) { const ids = Q.map((_, i) => i); for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; } return ids; }
// one fixed order, walked 7 at a time, so a prompt only repeats once every question has had its turn
const ORDER = shuffled(rng(20261101));
const dailySet = () => Array.from({ length: ROUNDS }, (_, k) => Q[ORDER[(((dayNum - 1) * ROUNDS + k) % Q.length + Q.length) % Q.length]]);
const endlessSet = () => shuffled(Math.random).slice(0, ROUNDS).map(i => Q[i]);
function untilMidnight() {
  const m = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - new Date();
  if (m <= 0) return "now (refresh!)";
  const s = Math.floor(m / 1000);
  return [s / 3600, (s % 3600) / 60, s % 60].map(v => String(Math.floor(v)).padStart(2, "0")).join(":");
}
setInterval(() => document.querySelectorAll(".nextIn").forEach(e => e.textContent = untilMidnight()), 1000);

/* ---------- matching ---------- */
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/&/g, "and")
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\bthe\b/g, " ").replace(/\s+/g, " ").trim();
}
const squash = s => norm(s).replace(/ /g, "").replace(/ou/g, "o").replace(/uu/g, "u");
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// Every spelling, plus single words of multi-word names:
// - a word no other answer has ("Kakashi") belongs to its answer;
// - a name a few answers share ("Rengoku", "Eren", "Monkey", "Uchiha") goes to the most famous of them,
//   which is the earliest on the list, unless it's a generic word like "Fruit", "Devil" or "World".
const GENERIC = new Set(["fruit", "devil", "breathing", "jutsu", "release", "style", "mode", "model", "gundam", "studio", "studios",
  "animation", "pictures", "production", "productions", "films", "film", "entertainment", "works", "online", "world", "life", "girls",
  "girl", "boys", "club", "team", "story", "season", "movie", "demon", "shenron", "sailor", "queen", "king", "prince", "princess",
  "captain", "another", "with", "from", "your", "this", "that", "into", "over", "when", "what", "just", "only", "like", "more", "most",
  "very", "next", "time", "days", "high", "school", "anime", "part", "great", "super", "little", "love", "dance", "technique", "fire",
  "water", "wind", "earth", "lightning"]);
// "Shadow Clone" for "Shadow Clone Jutsu", "Gomu Gomu no Mi" for "Gomu Gomu", "Gun" for "Gun Devil"
const stripSuffix = s => s.replace(/ (no )?(jutsu|fruit|mi|breathing|devil|technique)$/, "");
function buildKeys(q) {
  const owners = new Map();
  q.a.forEach((alts, i) => alts.forEach(s => norm(s).split(" ").forEach(w => {
    if (!owners.has(w)) owners.set(w, new Set());
    owners.get(w).add(i);
  })));
  const familyOf = new Map();
  for (const [w, set] of owners) {
    const n = set.size;
    if (n > 1 && n <= 12 && n <= q.a.length * 0.2 && w.length >= 4 && !GENERIC.has(w) && !/^\d+$/.test(w)) familyOf.set(w, Math.min(...set));
  }
  return q.a.map((alts, i) => {
    const keys = new Set(alts.map(squash));
    alts.forEach(s => { const t = stripSuffix(norm(s)); if (t.length >= 3) keys.add(squash(t)); });
    alts.forEach(s => {
      const ws = norm(s).split(" "); if (ws.length < 2) return;
      ws.forEach(w => { if (w.length >= 4 && owners.get(w).size === 1 && !GENERIC.has(w)) keys.add(squash(w)); });
    });
    return [...keys];
  }).map((keys, i) => { for (const [w, owner] of familyOf) if (owner === i) keys.push(squash(w)); return keys; });
}
function match(q, guess) {
  const g = squash(guess); if (!g) return -1;
  const gs = [...new Set([g, squash(stripSuffix(norm(guess)))])].filter(Boolean);
  const keys = q._keys ||= buildKeys(q);
  let best = -1, bestD = 9;
  keys.forEach((ks, i) => ks.forEach(k => gs.forEach(x => {
    const max = k.length >= 10 ? 2 : k.length >= 5 ? 1 : 0;

function resolve(i) {
  if (screen !== "prompt") return;
  screen = "reveal"; clearInterval(timer);
  const q = run.set[run.i], { p, N } = popularity(q);
  const tier = i < 0 ? -1 : tierOf(q, i, p), pts = tier < 0 ? 0 : TIERS[tier].pts;
  run.results.push({ q: q.q, answer: i < 0 ? null : q.a[i][0], tier, pts });
  run.points += pts; run.i++;
  if (run.kind === "daily") store.set("kaw.daily", { day: dayKey, kind: "daily", results: run.results, points: run.points, done: false });
  sendAnswer(q.q, i);
  $("guess").disabled = true; $("guess").blur();
  show("card", false); show("dock", false);
  renderReveal(q, i, tier, pts, p, N);
  show("reveal", true); renderHud(); $("reveal").scrollTop = 0;
  focus = 0.3; $("rvNext").classList.add("hidden");
  if (tier < 0) { sfx.miss(); setTimeout(showNext, 900); return; }
  sfx.tier(tier); flash(TIERS[tier].col);
  if (tier >= 3) { const s = $("stage"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); }
  burst(80, feetY(heroAlt) - 10, 10 + tier * 12, [TIERS[tier].col, "#ffffff"], 1 + tier * 0.3);
  climb = { from: heroAlt, to: Math.min(MAXALT, heroAlt + pts * 10), t0: performance.now(), dur: 600 + pts * 15, tier, done: showNext };
}
function showNext() {
  if (screen !== "reveal") return;
  const b = $("rvNext"); b.textContent = run.i < ROUNDS ? "NEXT PROMPT ▲" : "SEE YOUR CLIMB ▲";
  b.classList.remove("hidden"); b.focus({ preventScroll: true });
}
function flash(col) { const f = $("flash"); f.style.background = col; f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
function renderReveal(q, i, tier, pts, p, N) {
  const col = tier < 0 ? "#ff4d5e" : TIERS[tier].col, tw = $("rvTier");
  tw.textContent = tier < 0 ? "TIME'S UP" : TIERS[tier].name;
  tw.style.color = col; tw.style.textShadow = `0 0 18px ${col}99, 3px 3px 0 #0b0818`;
  tw.className = ""; void tw.offsetWidth; tw.className = tier === 4 ? "legend" : "pop";
  $("rvAnswer").textContent = tier < 0 ? "No answer this time" : `“${q.a[i][0]}”`;
  $("rvPts").textContent = tier < 0 ? "+0 PTS · HOLDING ON" : `+${pts} PTS · CLIMB ${(pts * 10).toLocaleString()} M`;
  $("rvLine").textContent = tier < 0 ? "Here's what other climbers said." : pickLine(TIERS[tier].lines);
  show("rvMeter", tier >= 0);
  $("meter").innerHTML = TIERS.map((T, k) => `<div class="${k === tier ? "on" : ""}" style="background:${T.col};color:${T.col}"></div>`).join("") + `<i id="rvMark" style="left:0%"></i>`;
  if (tier >= 0) requestAnimationFrame(() => requestAnimationFrame(() => $("rvMark").style.left = (meterPos(tier, p[i]) * 100) + "%"));
  const order = q.a.map((_, k) => k).sort((a, b) => p[b] - p[a]);
  $("rvStat").innerHTML = tier < 0 ? "" :
    `<b style="color:${col}">≈${pct(p[i])}</b> of climbers said this · <b>#${order.indexOf(i) + 1}</b> of ${q.a.length} answers` +
    `<br><small>${N < 25 ? "Early estimate. It gets sharper as more people play." : `Based on ${N.toLocaleString()} climbs`}</small>`;
  const rows = order.slice(0, 4); if (i >= 0 && !rows.includes(i)) rows.push(i);
  const top = p[order[0]];
  $("rvBoard").innerHTML = `<div class="bhead">MOST SAID</div>` + rows.map(k =>
    `<div class="brow${k === i ? " me" : ""}"><span class="bn">${k === i ? "▶ " : ""}${esc(q.a[k][0])}</span>` +
    `<span class="bb"><i style="width:${Math.max(4, p[k] / top * 100)}%;background:${TIERS[tierOf(q, k, p)].col}"></i></span><span class="bp">${pct(p[k])}</span></div>`).join("");
  const gem = q.a[q.a.length - 1][0];
  $("rvGem").textContent = tier === 4 ? "★ You found this prompt's hidden gem!" : `★ Hidden Legendary answer: ${mask(gem)}`;
}
function banner(r) {
  const b = $("banner");
  $("bannerT").textContent = `— ${REGIONS[r][0]} —`;
  $("bannerS").textContent = `${(r * 1000).toLocaleString()} m · ${REGIONS[r][1]}`;
  b.classList.remove("hidden", "show"); void b.offsetWidth; b.classList.add("show");
  sfx.region();
}

function stats() { return store.get("kaw.stats", { played: 0, best: 0, total: 0, streak: 0, maxStreak: 0, last: null, tiers: [0, 0, 0, 0, 0], misses: 0 }); }
function finish() {
  const data = { day: dayKey, kind: run.kind, results: run.results, points: run.points, done: true };
  if (run.kind === "daily") store.set("kaw.daily", data);
  const s = stats();
  if (run.kind === "daily") {
    s.played++; s.total += run.points;
    s.streak = s.last === yesterKey ? s.streak + 1 : s.last === dayKey ? s.streak : 1;
    s.maxStreak = Math.max(s.maxStreak, s.streak); s.last = dayKey;
  }
  s.best = Math.max(s.best, run.points);
  for (const r of run.results) r.tier < 0 ? s.misses++ : s.tiers[r.tier]++;
  store.set("kaw.stats", s);
  if (run.points >= MAXPTS) { sfx.fanfare(); for (let k = 0; k < 4; k++) setTimeout(() => burst(80, feetY(heroAlt) - 10, 40, TIERS.map(T => T.col), 2), k * 250); }
  else sfx.done();
  showSummary(data);
}
const gridOf = results => results.map(r => r.tier < 0 ? "⬛" : TIERS[r.tier].emoji).join("");
const regionAt = alt => REGIONS[Math.min(NS - 1, Math.floor(alt / 1000))][0];
function showSummary(data) {
  screen = "summary"; focus = 0.4; clearInterval(timer);
  if (!run) run = { kind: data.kind, results: data.results, points: data.points, i: ROUNDS };
  heroAlt = data.points * 10; lastRegion = NS;
  ["title", "card", "dock", "reveal"].forEach(id => show(id, false)); show("hud", true); renderHud(); document.body.classList.remove("on-title");
  const alt = data.points * 10;
  $("smHead").textContent = data.kind === "daily" ? `CLIMB REPORT · DAY #${dayNum}` : "ENDLESS CLIMB REPORT";
  $("smAlt").textContent = fmtM(alt);
  $("smWhere").textContent = alt >= MAXALT ? "You reached the summit of Sky Castle!" : `You reached ${regionAt(alt).toLowerCase().replace(/\b\w/g, c => c.toUpperCase())}`;
  $("smGrid").textContent = gridOf(data.results);
  $("smRows").innerHTML = data.results.map((r, k) => {
    const T = r.tier < 0 ? { name: "MISS", col: "#ff4d5e" } : TIERS[r.tier];
    return `<div class="srow"><span class="mute">${k + 1}</span><span class="st">${esc(r.q.replace(/^Name (a|an) /, ""))}</span><span class="sa">${r.answer ? esc(r.answer) : "—"}</span><span class="chip" style="background:${T.col}">${T.name} +${r.pts}</span></div>`;
  }).join("");
  $("smNext").innerHTML = data.kind === "daily" ? `Next daily climb in <span class="nextIn">${untilMidnight()}</span>` : "";
  $("smShare").textContent = "COPY RESULT";
  show("summary", true);
}
function shareText(data) {
  return `Kawillion ${data.kind === "daily" ? "#" + dayNum : "(endless)"} ▲ ${fmtM(data.points * 10)}\n${gridOf(data.results)}\nkawillion.rennko.tech`;
}

function home() {
  screen = "title"; run = null; climb = null; clearInterval(timer); document.body.classList.add("on-title");
  ["hud", "card", "dock", "reveal", "summary", "banner"].forEach(id => show(id, false)); show("title", true);
  focus = 0.55; heroAlt = 0; lastRegion = 0;
  const saved = store.get("kaw.daily", null), s = stats();
  $("dayLabel").textContent = `DAY #${dayNum}`;
  $("streak").textContent = s.streak && (s.last === dayKey || s.last === yesterKey) ? `🔥 ${s.streak}-day streak` : "";
  if (saved?.day === dayKey && saved.done) {
    $("begin").textContent = "▲ VIEW TODAY'S CLIMB ▲";
    $("status").innerHTML = `Today: <b style="color:var(--gold)">${fmtM(saved.points * 10)}</b> ${gridOf(saved.results)}<br><small>New prompts in <span class="nextIn">${untilMidnight()}</span></small>`;
  } else if (saved?.day === dayKey) {
    $("begin").textContent = "▲ CONTINUE CLIMB ▲";
    $("status").innerHTML = `<small>Prompt ${saved.results.length + 1} of ${ROUNDS} · ${fmtM(saved.points * 10)} so far</small>`;
  } else {
    $("begin").textContent = "▲ BEGIN CLIMB ▲";
    $("status").innerHTML = `<small>7 prompts · 25 seconds each · one answer per prompt</small>`;
  }
}

function modal(html) { $("modalBody").innerHTML = html + `<div class="row" style="margin-top:14px"><button class="btn go" onclick="closeModal()">GOT IT</button></div>`; show("modal", true); }
function closeModal() { show("modal", false); if (screen === "prompt") $("guess").focus(); }
function helpModal() {
  modal(`<h3>HOW TO PLAY</h3>
    <p>Every day there are <b>7 anime prompts</b>, the same for everyone. You get <b>25 seconds</b> and <b>one answer</b> for each.</p>
    <p>If your answer isn't on the list, you can try again while the clock runs. Spelling doesn't have to be perfect, and a unique first or last name is enough.</p>
    <p>The <b>rarer</b> your answer, the more points you score and the higher you climb. Rarity comes from what other climbers answer.</p>
    <div style="margin:10px 0">${TIERS.map(T => `<div class="trow"><span style="color:${T.col}">${T.emoji} ${T.name}</span><span>+${T.pts} pts · ${T.pts * 10} m</span></div>`).join("")}</div>
    <p>Each prompt has one hidden <b style="color:var(--gold)">Legendary</b> answer. A perfect day reaches the Sky Castle at 7,000 m.</p>`);
}
function statsModal() {
  const s = stats(), total = s.tiers.reduce((a, b) => a + b, 0) + s.misses, mx = Math.max(1, ...s.tiers, s.misses);
  modal(`<h3>YOUR STATS</h3>
    <div class="stats"><div><b>${s.played}</b><span>climbs</span></div><div><b>${s.played ? fmtM(s.total / s.played * 10).replace(" m", "") : 0}</b><span>avg m</span></div><div><b>${s.streak}</b><span>streak</span></div><div><b>${s.maxStreak}</b><span>best streak</span></div></div>
    <p class="mute">Best climb: <b style="color:var(--gold)">${fmtM(s.best * 10)}</b> · ${total} answers given</p>
    ${TIERS.map((T, k) => `<div class="brow"><span style="color:${T.col}">${T.name}</span><span class="bb"><i style="width:${s.tiers[k] / mx * 100}%;background:${T.col}"></i></span><span class="bp">${s.tiers[k]}</span></div>`).join("")}
    <div class="brow"><span style="color:#ff4d5e">TIME'S UP</span><span class="bb"><i style="width:${s.misses / mx * 100}%;background:#ff4d5e"></i></span><span class="bp">${s.misses}</span></div>`);
}

$("logo").innerHTML = [..."KAWILLION"].map((c, k) => `<span style="animation-delay:${k * 0.09}s">${c}</span>`).join("");
$("begin").onclick = () => startRun("daily");
$("endless").onclick = $("smEndless").onclick = () => startRun("endless");
$("smHome").onclick = $("homeBtn").onclick = () => { sfx.click(); home(); };
$("howBtn").onclick = $("helpIcon").onclick = helpModal;
$("statsBtn").onclick = $("statsIcon").onclick = statsModal;
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
$("soundBtn").onclick = () => { const m = sfx.toggle(); $("soundBtn").textContent = m ? "×" : "♪"; if (!m) sfx.click(); };
$("soundBtn").textContent = sfx.muted ? "×" : "♪";
$("climbBtn").onclick = submit;
$("rvNext").onclick = () => { sfx.click(); nextPrompt(); };
$("smShare").onclick = () => {
  const data = store.get("kaw.daily", null)?.done && run?.kind === "daily" ? store.get("kaw.daily", null) : { kind: run.kind, results: run.results, points: run.points };
  navigator.clipboard?.writeText(shareText(data)).then(() => $("smShare").textContent = "COPIED!", () => {});
};
$("guess").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); submit(); } else if (e.key.length === 1) sfx.key(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modal").classList.contains("hidden")) return closeModal();
  if (e.key !== "Enter" || !$("modal").classList.contains("hidden") || e.target.tagName === "BUTTON") return;
  if (screen === "reveal" && !$("rvNext").classList.contains("hidden")) $("rvNext").click();
  else if (screen === "title") $("begin").click();
});
home();
requestAnimationFrame(frame);
</script>
</body>
</html>
